<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FASHION STORE</title>
</head>
<body>

    <!-- Dark styled Navigation Bar matching your design structure -->
    <nav style="background-color: #333; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center;">
        <h2 style="margin: 0;">FASHION STORE</h2>
        
        <div style="display: flex; gap: 15px; align-items: center;">
            <a href="{% url 'home' %}" style="color: white; text-decoration: none;">HOME</a>
            <a href="#" style="color: white; text-decoration: none;">ORDERS</a>
            <a href="#" style="color: white; text-decoration: none;">DEALS</a>
            <a href="#" style="color: white; text-decoration: none;">LOCATION</a>
            
            {% if user.is_authenticated %}
                <span style="margin-left: 10px;">Welcome, {{ user.username }}!</span>
                <form action="{% url 'logout' %}" method="POST" style="display: inline; margin: 0;">
                    {% csrf_token %}
                    <button type="submit" style="background: #e74c3c; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 4px;">Logout</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}" style="color: white; text-decoration: none;">Login</a>
                <!-- Orange accent highlight for the Sign Up button to stand out -->
                <a class="btn btn-light btn-sm text-dark px-3 fw-bold" href="{% url 'signup' %}">
    SIGN UP
</a>
            {% endif %} 
        </div>
    </nav>

    <!-- Main Dynamic Content Block where index, signup, and login templates inject their files -->
    <main style="padding: 20px; min-height: 70vh;">
        {% block content %}
        
        {% endblock %}
    </main>

    <!-- Footer for FASHION STORE -->
    <footer style="background-color: #eee; padding: 15px; margin-top: 50px; text-align: center;">
        <p style="margin: 0; color: #555;">&copy; 2026 FASHION STORE. All rights reserved.</p>
    </footer>

</body>
</html>
