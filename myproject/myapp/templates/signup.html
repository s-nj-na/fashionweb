{% extends 'base.html' %}

{% block content %}

<h2>Create an Account</h2>

<div style="background-color: green; padding: 20px; width: 350px;">
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" style="padding: 10px; background-color: #007bff; color: white;">
            Sign Up
        </button>
    </form>
</div>

<p>
    Already have an account?
    <a href="{% url 'login' %}">Login Here</a>.
</p>

{% endblock %}
