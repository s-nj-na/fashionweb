{% extends 'base.html' %}
{% block content %}
<div class="mt-4">
    <h2>{% if object %}Edit Task{% else %}Create Task{% endif %}</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Save Task</button>
        <a href="{% url 'task_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
